</html>


<!-- <!DOCTYPE html> → bunun HTML5 dokümanı olduğunu belirtir.
* <html> → sayfanın ana elementi.
* <head> → sayfanın metadata ve kaynak bağlantıları.
* <body> → kullanıcının gördüğü içerik burada olacak.
* <link rel="stylesheet"...> → CSS dosyasını bağlıyor.
* meta viewport → responsive davranış için önemli.--
